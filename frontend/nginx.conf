server {
    listen 80;
    server_name localhost;

    # Ruta base del build de React
    root /usr/share/nginx/html;
    index index.html;

    location = /sistemaRegistrosIdhuca {
    return 301 /sistemaRegistrosIdhuca/;
    }

    # Sirve la SPA desde el subpath, pero los archivos viven directamente en /usr/share/nginx/html
    location /sistemaRegistrosIdhuca/ {
    try_files $uri $uri/ /sistemaRegistrosIdhuca/index.html;
    }

    # Proxy hacia backend (tal como lo tenías)
    location /idhuca-indicadores/api/srv/ {
        proxy_pass http://backend:8080/idhuca-indicadores/api/srv/;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/backup/ {
        proxy_pass http://backend:8080/api/backup/;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Si también haces llamadas con el prefijo del contexto
    location /sistemaRegistrosIdhuca/idhuca-indicadores/api/srv/ {
        proxy_pass http://backend:8080/idhuca-indicadores/api/srv/;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /sistemaRegistrosIdhuca/api/backup/ {
        proxy_pass http://backend:8080/api/backup/;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Manejo de errores SPA (React Router)
    error_page 404 /index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
